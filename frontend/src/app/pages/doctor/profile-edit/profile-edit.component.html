<div class="dashboard-layout">
  <app-sidebar [items]="sidebarItems" title="Doctor"></app-sidebar>
  <main class="dashboard-main">
    <div class="page-header animate-fade-in-up">
      <h1 id="profile-edit-title">Edit Profile</h1>
      <p class="subtitle">Update your professional information</p>
    </div>

    <div class="profile-form-card animate-fade-in-up">
      <form (ngSubmit)="onSubmit()" id="doctor-profile-form">
        <div class="form-group">
          <label for="specialite">Specialty ID</label>
          <input type="number" id="specialite" class="form-control"
                 [(ngModel)]="profile.specialite_id" name="specialite_id" min="1">
        </div>

        <div class="form-group">
          <label for="adresse">Address</label>
          <input type="text" id="adresse" class="form-control"
                 [(ngModel)]="profile.adresse" name="adresse"
                 placeholder="Your clinic address">
        </div>

        <div class="form-group">
          <label for="tarif">Consultation Fee (DH)</label>
          <input type="number" id="tarif" class="form-control"
                 [(ngModel)]="profile.tarif" name="tarif"
                 placeholder="e.g., 200" min="0">
        </div>

        <div class="form-group">
          <label for="bio">Biography</label>
          <textarea id="bio" class="form-control textarea"
                    [(ngModel)]="profile.biographie" name="biographie"
                    placeholder="Tell patients about your experience..."
                    rows="4"></textarea>
        </div>

        <div *ngIf="error" class="alert alert-error">{{ error }}</div>
        <div *ngIf="success" class="alert alert-success">{{ success }}</div>

        <button type="submit" class="btn btn-primary" [disabled]="loading" id="btn-save-profile">
          <span *ngIf="!loading">Save Profile</span>
          <span *ngIf="loading" class="spinner"></span>
        </button>
      </form>
    </div>
  </main>
</div>
