<div class="auth-page">
  <div class="auth-container animate-fade-in-up">
    <!-- LOGO -->
    <div class="auth-logo-section">
      <div class="logo-box-rounded">
        <i data-lucide="stethoscope"></i>
      </div>
    </div>

    <!-- HEADER -->
    <div class="auth-header">
      <h1>Complete your profile</h1>
      <p>Please provide your medical practice details</p>
    </div>

    <!-- FORM -->
    <div class="auth-card profile-card">
      <form (ngSubmit)="onSubmit()" class="auth-form">
        <div class="form-group">
          <label>Office Address</label>
          <div class="input-container-modern">
            <i data-lucide="map-pin"></i>
            <input type="text" [(ngModel)]="address" name="address" class="form-control-modern" placeholder="e.g., Rue de la Liberté, Tunis" required>
          </div>
        </div>

        <div class="form-group">
          <label>Consultation Fee (DT)</label>
          <div class="input-container-modern">
            <i data-lucide="banknote"></i>
            <input type="number" [(ngModel)]="fee" name="fee" class="form-control-modern" placeholder="50" required>
          </div>
        </div>

        <div class="form-group">
          <label>Medical Specialty</label>
          <div class="input-container-modern">
            <i data-lucide="pulse"></i>
            <select [(ngModel)]="selectedSpecialty" name="selectedSpecialty" class="form-control-modern" required>
              <option value="" disabled selected>Select a specialty</option>
              <option *ngFor="let s of specialites" [value]="s.id">{{ s.nom }}</option>
            </select>
            <i data-lucide="chevron-down" class="select-arrow"></i>
          </div>
        </div>

        <div *ngIf="error" class="error-box animate-fade-in">
          <i data-lucide="alert-circle"></i>
          <span>{{ error }}</span>
        </div>

        <button type="submit" class="btn-primary-modern" [disabled]="loading">
          <span *ngIf="!loading">Create Profile <i data-lucide="arrow-right"></i></span>
          <i data-lucide="loader-2" *ngIf="loading" class="animate-spin"></i>
        </button>
      </form>
    </div>
  </div>
</div>
