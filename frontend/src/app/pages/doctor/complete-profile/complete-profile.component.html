<div class="auth-page">
  <div class="auth-container animate-fade-in-up">
    <!-- LOGO -->
    <div class="auth-logo-section">
      <div class="logo-box">
        <i data-lucide="stethoscope"></i>
      </div>
    </div>

    <!-- HEADER -->
    <div class="auth-header">
      <h1>Complete your profile</h1>
      <p>Please provide your medical practice details</p>
    </div>

    <!-- FORM -->
    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="address">Office Address</label>
        <div class="input-container">
          <i data-lucide="map-pin" class="input-icon"></i>
          <input type="text" id="address" [(ngModel)]="address" name="address" class="form-control" placeholder="e.g., Rue de la Liberté, Tunis" required>
        </div>
      </div>

      <div class="form-group">
        <label for="fee">Consultation Fee (DT)</label>
        <div class="input-container">
          <i data-lucide="banknote" class="input-icon"></i>
          <input type="number" id="fee" [(ngModel)]="fee" name="fee" class="form-control" placeholder="50" required>
        </div>
      </div>

      <div class="form-group">
        <label for="specialty">Medical Specialty</label>
        <div class="input-container">
          <i data-lucide="activity" class="input-icon"></i>
          <select id="specialty" [(ngModel)]="selectedSpecialty" name="selectedSpecialty" class="form-control" required>
            <option value="" disabled selected>Select a specialty</option>
            <option *ngFor="let sp of specialites" [value]="sp.id">{{ sp.nom }}</option>
          </select>
        </div>
      </div>

      <!-- MESSAGES -->
      <div *ngIf="error" class="error-box">
        <i data-lucide="alert-circle"></i>
        <span>{{ error }}</span>
      </div>

      <button type="submit" class="btn-auth-submit" [disabled]="loading">
        <span *ngIf="!loading">Create Profile <i data-lucide="arrow-right" class="ml-2 inline-block"></i></span>
        <i data-lucide="loader-2" *ngIf="loading" class="animate-spin"></i>
      </button>
    </form>
  </div>
</div>
