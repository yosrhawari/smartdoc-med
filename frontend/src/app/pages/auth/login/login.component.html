<div class="auth-page">
  <div class="auth-container animate-fade-in-up">
    <!-- LOGO -->
    <div class="auth-logo-section">
      <div class="logo-box">
        <i data-lucide="pulse"></i>
      </div>
    </div>

    <!-- HEADER -->
    <div class="auth-header">
      <h1>Welcome Back</h1>
      <p>Sign in to access your account</p>
    </div>

    <!-- FORM -->
    <div class="auth-card">
      <form (ngSubmit)="onSubmit()" class="auth-form">
        <div class="form-group">
          <label>Email</label>
          <div class="input-with-icon">
            <i data-lucide="mail"></i>
            <input type="email" [(ngModel)]="email" name="email" class="form-control" placeholder="your@email.com" required>
          </div>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="input-with-icon">
            <i data-lucide="lock"></i>
            <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password" class="form-control" placeholder="••••••••" required>
            <button type="button" class="password-toggle" (click)="togglePassword()">
              <i [attr.data-lucide]="showPassword ? 'eye-off' : 'eye'"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-auth-submit" [disabled]="loading">
          <span *ngIf="!loading">Sign In</span>
          <i data-lucide="loader-2" *ngIf="loading" class="animate-spin"></i>
        </button>

        <div *ngIf="error" class="error-box animate-fade-in">
          <i data-lucide="alert-circle"></i>
          <span>{{ error }}</span>
        </div>
      </form>

      <div class="auth-footer">
        <p>Don't have an account? <a routerLink="/register">Sign up</a></p>
      </div>
    </div>

    <div class="ssl-notice">
      <i data-lucide="shield-check"></i>
      <span>Secure 256-bit SSL encrypted connection</span>
    </div>
  </div>
</div>
