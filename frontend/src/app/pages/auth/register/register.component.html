<div class="auth-page">
  <div class="auth-container animate-fade-in-up">
    <div class="auth-header">
      <a routerLink="/" class="auth-logo" id="register-logo">
        <svg width="40" height="40" viewBox="0 0 32 32" fill="none">
          <rect width="32" height="32" rx="8" fill="#2563EB"/>
          <path d="M16 7V25M7 16H25" stroke="white" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </a>
      <h1 id="register-title">Create Account</h1>
      <p>Join SmartDoc Med today</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="auth-form" id="register-form">
      <!-- Role Selection -->
      <label class="role-main-label">I am a</label>
      <div class="role-selector">
        <div class="role-option"
             [class.selected]="role === 'PATIENT'"
             (click)="selectRole('PATIENT')"
             id="role-patient">
          <div class="role-icon">🏥</div>
          <div class="role-label">Patient</div>
          <div class="role-desc">Find & book doctors</div>
        </div>
        <div class="role-option"
             [class.selected]="role === 'MEDECIN'"
             (click)="selectRole('MEDECIN')"
             id="role-doctor">
          <div class="role-icon">🩺</div>
          <div class="role-label">Doctor</div>
          <div class="role-desc">Manage your practice</div>
        </div>
      </div>

      <div class="form-group">
        <label for="reg-email">Email Address</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <input type="email"
                 id="reg-email"
                 class="form-control"
                 [(ngModel)]="email"
                 name="email"
                 placeholder="Enter your email"
                 autocomplete="email">
        </div>
      </div>

      <div class="form-group">
        <label for="reg-password">Password</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          <input [type]="showPassword ? 'text' : 'password'"
                 id="reg-password"
                 class="form-control"
                 [(ngModel)]="password"
                 name="password"
                 placeholder="Minimum 6 characters"
                 autocomplete="new-password">
          <button type="button" class="password-toggle" (click)="togglePassword()">
            <svg *ngIf="!showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg *ngIf="showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="reg-confirm">Confirm Password</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <input [type]="showPassword ? 'text' : 'password'"
                 id="reg-confirm"
                 class="form-control"
                 [(ngModel)]="confirmPassword"
                 name="confirmPassword"
                 placeholder="Confirm your password"
                 autocomplete="new-password">
        </div>
      </div>

      <div *ngIf="error" class="alert alert-error" id="register-error">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        {{ error }}
      </div>

      <div *ngIf="success" class="alert alert-success" id="register-success">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        {{ success }}
      </div>

      <button type="submit" class="btn btn-primary btn-full" [disabled]="loading" id="btn-register">
        <span *ngIf="!loading">Create Account</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a routerLink="/login" id="link-login">Sign in</a></p>
    </div>
  </div>
</div>
