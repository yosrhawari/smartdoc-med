<div class="auth-page">
  <div class="auth-container animate-fade-in-up">
    <!-- LOGO -->
    <div class="auth-logo-section">
      <div class="logo-box">
        <i data-lucide="activity"></i>
      </div>
    </div>

    <!-- HEADER -->
    <div class="auth-header">
      <h1>Create Account</h1>
      <p>Join SmartDoc Med today</p>
    </div>

    <!-- FORM -->
    <form (ngSubmit)="onSubmit()" class="auth-form">
      
      <!-- STEP 1: BASIC INFO -->
      <div *ngIf="step === 1" class="animate-fade-in">
        <!-- ROLE SELECTION -->
        <div class="form-group">
          <label class="section-label">I am a...</label>
          <div class="role-grid">
            <div class="role-card" 
                 [class.selected]="role === 'PATIENT'"
                 (click)="selectRole('PATIENT')">
              <div class="role-icon">
                <i data-lucide="user"></i>
              </div>
              <div class="role-info">
                <span class="role-title">Patient</span>
                <span class="role-desc">Find and book doctors</span>
              </div>
            </div>
            <div class="role-card" 
                 [class.selected]="role === 'MEDECIN'"
                 (click)="selectRole('MEDECIN')">
              <div class="role-icon">
                <i data-lucide="stethoscope"></i>
              </div>
              <div class="role-info">
                <span class="role-title">Doctor</span>
                <span class="role-desc">Manage appointments</span>
              </div>
            </div>
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label for="prenom">First Name</label>
            <input type="text" id="prenom" [(ngModel)]="prenom" name="prenom" class="form-control" placeholder="John" required>
          </div>
          <div class="form-group">
            <label for="nom">Last Name</label>
            <input type="text" id="nom" [(ngModel)]="nom" name="nom" class="form-control" placeholder="Doe" required>
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" [(ngModel)]="email" name="email" class="form-control" placeholder="your@email.com" required>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" [(ngModel)]="password" name="password" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" [(ngModel)]="confirmPassword" name="confirmPassword" class="form-control" required>
          </div>
        </div>

        <div class="form-group checkbox-group">
          <input type="checkbox" id="terms" [(ngModel)]="agreeToTerms" name="terms" required>
          <label for="terms">I agree to the <a href="#">Terms</a></label>
        </div>
      </div>

      <!-- STEP 2: DOCTOR DETAILS (ONLY FOR MEDECIN) -->
      <div *ngIf="step === 2 && role === 'MEDECIN'" class="animate-fade-in">
        <div class="step-header">
          <button type="button" class="btn-back" (click)="prevStep()">
            <i data-lucide="arrow-left"></i> Back
          </button>
          <span class="step-title">Practice Details</span>
        </div>

        <div class="form-group">
          <label for="address">Office Address</label>
          <div class="input-container">
            <i data-lucide="map-pin" class="input-icon"></i>
            <input type="text" id="address" [(ngModel)]="address" name="address" class="form-control" placeholder="e.g., Rue de la Liberté, Tunis" required>
          </div>
        </div>

        <div class="form-group">
          <label for="fee">Consultation Fee (DT)</label>
          <div class="input-container">
            <i data-lucide="banknote" class="input-icon"></i>
            <input type="number" id="fee" [(ngModel)]="fee" name="fee" class="form-control" placeholder="50" required>
          </div>
        </div>

        <div class="form-group">
          <label for="specialty">Medical Specialty</label>
          <div class="input-container">
            <i data-lucide="activity" class="input-icon"></i>
            <select id="specialty" [(ngModel)]="selectedSpecialty" name="selectedSpecialty" class="form-control" required>
              <option value="" disabled selected>Select a specialty</option>
              <option *ngFor="let sp of specialites" [value]="sp.id">{{ sp.nom }}</option>
            </select>
          </div>
        </div>
      </div>

      <!-- MESSAGES -->
      <div *ngIf="error" class="error-box animate-fade-in">
        <i data-lucide="alert-circle"></i>
        <span>{{ error }}</span>
      </div>

      <div *ngIf="success" class="success-box animate-fade-in">
        <i data-lucide="check-circle"></i>
        <span>{{ success }}</span>
      </div>


      <button type="submit" class="btn-auth-submit" [disabled]="loading">
        <span *ngIf="!loading">
          {{ (role === 'MEDECIN' && step === 1) ? 'Continue' : 'Create Account' }}
        </span>
        <i data-lucide="loader-2" *ngIf="loading" class="animate-spin"></i>
      </button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a routerLink="/login">Sign in</a></p>
    </div>
  </div>
</div>
