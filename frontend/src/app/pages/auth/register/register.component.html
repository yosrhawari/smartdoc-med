<div class="auth-page">
  <div class="auth-container animate-fade-in-up">
    <!-- LOGO -->
    <div class="auth-logo-section">
      <div class="logo-box">
        <i data-lucide="pulse"></i>
      </div>
    </div>

    <!-- HEADER -->
    <div class="auth-header">
      <h1>Create Account</h1>
      <p>Join SmartDoc Med today</p>
    </div>

    <!-- ROLE SELECTION -->
    <div class="role-selection-section">
      <label class="section-label">I am a...</label>
      <div class="role-grid">
        <div class="role-card" 
             [class.selected]="role === 'PATIENT'"
             (click)="selectRole('PATIENT')">
          <div class="role-icon">
            <i data-lucide="user"></i>
          </div>
          <div class="role-info">
            <span class="role-title">Patient</span>
            <span class="role-desc">Find and book doctors</span>
          </div>
        </div>
        <div class="role-card" 
             [class.selected]="role === 'MEDECIN'"
             (click)="selectRole('MEDECIN')">
          <div class="role-icon">
            <i data-lucide="stethoscope"></i>
          </div>
          <div class="role-info">
            <span class="role-title">Doctor</span>
            <span class="role-desc">Manage appointments</span>
          </div>
        </div>
      </div>
    </div>

    <!-- FORM -->
    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="grid-2">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" [(ngModel)]="prenom" name="prenom" class="form-control" placeholder="John" required>
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" [(ngModel)]="nom" name="nom" class="form-control" placeholder="Doe" required>
        </div>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" class="form-control" placeholder="your@email.com" required>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>Password</label>
          <input type="password" [(ngModel)]="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" class="form-control" placeholder="••••••••" required>
        </div>
      </div>

      <div class="form-group checkbox-group">
        <input type="checkbox" id="terms" [(ngModel)]="agreeToTerms" name="terms" required>
        <label for="terms">I agree to the <a href="#">Terms</a></label>
      </div>

      <!-- MESSAGES -->
      <div *ngIf="error" class="error-box animate-fade-in">
        <i data-lucide="alert-circle"></i>
        <span>{{ error }}</span>
      </div>

      <div *ngIf="success" class="success-box animate-fade-in">
        <i data-lucide="check-circle"></i>
        <span>{{ success }}</span>
      </div>

      <button type="submit" class="btn-auth-submit" [disabled]="loading">
        <span *ngIf="!loading">Create Account</span>
        <i data-lucide="loader-2" *ngIf="loading" class="animate-spin"></i>
      </button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a routerLink="/login">Sign in</a></p>
    </div>
  </div>
</div>
