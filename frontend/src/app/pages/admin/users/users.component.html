<div class="dashboard-layout">
  <app-sidebar [items]="sidebarItems" title="Admin"></app-sidebar>
  <main class="dashboard-main">
    <div class="page-header animate-fade-in-up">
      <div>
        <h1 id="admin-users-title">User Management</h1>
        <p class="subtitle">All registered platform users</p>
      </div>
      <div class="search-bar">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" class="form-control"
               [(ngModel)]="searchQuery" (input)="onSearch()"
               placeholder="Search by email or role..." id="user-search"> <!-- barre de recherche pour filtrer les utilisateurs par email ou rôle --> 
               <!--amlna two way data binding w input event -->
      </div>
    </div>

    <div class="table-wrapper animate-fade-in-up">
      <table class="data-table" *ngIf="filteredUsers.length > 0" id="users-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Email</th>
            <th>Role</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of filteredUsers">
            <td>#{{ user.id }}</td>
            <td>{{ user.email }}</td>
            <td><span class="badge" [ngClass]="getRoleBadgeClass(user.role)">{{ user.role }}</span></td>
          </tr>
        </tbody>
      </table>
      <div *ngIf="filteredUsers.length === 0" class="empty-state">
        <h3>No Users Found</h3>
      </div>
    </div>
  </main>
</div>
