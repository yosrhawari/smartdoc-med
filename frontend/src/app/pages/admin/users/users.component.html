<div class="dashboard-layout">
  <app-sidebar [items]="sidebarItems" title="Admin"></app-sidebar>

  <main class="dashboard-main">
    <div class="dashboard-header animate-fade-in-up">
      <div class="header-main">
        <h1>User Management</h1>
        <p class="subtitle">Maintain and monitor all registered accounts</p>
      </div>
      <div class="header-actions">
        <div class="search-box">
          <i data-lucide="search"></i>
          <input 
            type="text" 
            [(ngModel)]="searchQuery" 
            (input)="onSearch()" 
            placeholder="Search email or role..."
          >
        </div>
      </div>
    </div>

    <div *ngIf="loading" class="loading-state">
      <div class="loader-wrapper">
        <i data-lucide="loader-2" class="animate-spin"></i>
      </div>
    </div>

    <div class="card overflow-hidden animate-fade-in-up">
      <div class="table-container">
        <table class="data-table" *ngIf="filteredUsers.length > 0">
          <thead>
            <tr>
              <th>ID</th>
              <th>User Account</th>
              <th>Role</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let user of filteredUsers">
              <td class="text-muted">#{{ user.id }}</td>
              <td>
                <div class="user-info-cell">
                  <div class="avatar-xs">
                    {{ user.email.charAt(0).toUpperCase() }}
                  </div>
                  <span>{{ user.email }}</span>
                </div>
              </td>
              <td>
                <span class="badge" [ngClass]="getRoleBadgeClass(user.role)">
                  {{ user.role }}
                </span>
              </td>
              <td>
                <span class="status-dot online"></span>
                <span class="text-xs">Active</span>
              </td>
              <td>
                <div class="table-actions">
                  <button class="icon-btn-sm" title="Edit"><i data-lucide="edit-2"></i></button>
                  <button class="icon-btn-sm text-destructive" title="Delete"><i data-lucide="trash-2"></i></button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>

        <div *ngIf="!loading && filteredUsers.length === 0" class="empty-state">
          <div class="empty-icon-wrapper">
            <i data-lucide="users"></i>
          </div>
          <h3>No users found</h3>
          <p>We couldn't find any accounts matching your search.</p>
        </div>
      </div>
    </div>
  </main>
</div>
