<div class="dashboard-layout">
  <app-sidebar [items]="sidebarItems" title="Patient"></app-sidebar>

  <main class="dashboard-main">
    <div class="page-header animate-fade-in-up">
      <div>
        <h1 id="doctors-title">All Doctors</h1>
        <p class="subtitle">Browse verified healthcare professionals</p>
      </div>
      <div class="search-bar">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text"
               class="form-control"
               [(ngModel)]="searchQuery"
               (input)="onSearch()"
               placeholder="Search by location..."
               id="doctor-search">
      </div>
    </div>

    <div *ngIf="loading" class="loading-state">
      <div class="spinner-lg"></div>
      <p>Loading doctors...</p>
    </div>

    <div *ngIf="!loading" class="doctors-grid animate-fade-in-up">
      <div *ngFor="let doctor of filteredDoctors; let i = index"
           class="doctor-card"
           [style.animation-delay]="(i * 0.08) + 's'">
        <div class="doctor-card-header">
          <div class="doctor-avatar">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <div class="doctor-rating">
            <div class="stars-small">
              <svg *ngFor="let filled of getStarArray(doctor.note_moyenne)"
                   width="12" height="12" viewBox="0 0 24 24"
                   [attr.fill]="filled ? '#F59E0B' : 'none'"
                   [attr.stroke]="filled ? '#F59E0B' : '#CBD5E1'" stroke-width="2">
                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
              </svg>
            </div>
            <span class="rating-num">{{ doctor.note_moyenne }}</span>
          </div>
        </div>

<h3 class="doctor-name">
  {{ doctor.nom ? ('Dr. ' + doctor.nom + ' ' + doctor.prenom) : ('Doctor #' + doctor.medecin_id) }}
</h3>        <div class="doctor-meta">
          <span class="meta-item">📍 {{ doctor.adresse }}</span>
        </div>

        <div class="doctor-card-actions">
          <a [routerLink]="['/patient/doctor', doctor.medecin_id]" class="btn btn-secondary btn-sm">View Profile</a>
          <a [routerLink]="['/patient/book', doctor.medecin_id]" class="btn btn-primary btn-sm">Book Now</a>
        </div>
      </div>
    </div>

    <div *ngIf="!loading && filteredDoctors.length === 0" class="empty-state">
      <h3>No Doctors Found</h3>
      <p>Try adjusting your search criteria</p>
    </div>
  </main>
</div>
