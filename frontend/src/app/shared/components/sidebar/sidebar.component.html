<aside class="sidebar" [class.collapsed]="collapsed">
  <div class="sidebar-header">
    <div class="header-content-wrapper" (click)="navigateDashboard()" [class.collapsed]="collapsed">
      <div class="header-content" *ngIf="!collapsed">
        <div class="header-icon">
          <i data-lucide="shield-plus"></i>
        </div>
        <h3>{{ title }}</h3>
      </div>
      <div class="header-icon" *ngIf="collapsed">
        <i data-lucide="shield-plus"></i>
      </div>
    </div>
    <button class="collapse-btn" (click)="toggleCollapse()" [title]="collapsed ? 'Expand' : 'Collapse'">
      <i [attr.data-lucide]="collapsed ? 'chevron-right' : 'chevron-left'"></i>
    </button>
  </div>


  <nav class="sidebar-nav">
    <a *ngFor="let item of items"
       [routerLink]="item.route"
       routerLinkActive="active"
       [routerLinkActiveOptions]="{exact: true}"
       class="sidebar-link"
       [title]="item.label">
      <div class="link-icon">
        <i [attr.data-lucide]="item.icon"></i>
      </div>
      <span class="sidebar-label" *ngIf="!collapsed">{{ item.label }}</span>
      <div class="active-indicator" *ngIf="!collapsed"></div>
    </a>
  </nav>

  <div class="sidebar-footer">
    <button class="logout-btn" (click)="logout()" [title]="collapsed ? 'Sign Out' : ''">
      <div class="link-icon">
        <i data-lucide="log-out"></i>
      </div>
      <span class="sidebar-label" *ngIf="!collapsed">Sign Out</span>
    </button>
  </div>
</aside>
