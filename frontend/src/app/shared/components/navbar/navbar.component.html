<nav class="navbar" id="main-navbar">
  <div class="navbar-container">
    <!-- Logo -->
    <a [routerLink]="auth.getDashboardRoute()" class="navbar-brand" id="navbar-logo">
      <div class="logo-icon">
        <i data-lucide="activity"></i>
      </div>
      <span class="brand-text">SmartDoc <span class="brand-accent">Med</span></span>
    </a>

    <!-- Desktop Nav -->
    <div class="navbar-links" [class.mobile-open]="mobileMenuOpen">
      <!-- Unauthenticated -->
      <ng-container *ngIf="(auth.currentUser$ | async) === null">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">Home</a>
        <a routerLink="/login" class="nav-link" id="nav-login">Login</a>
        <a routerLink="/register" class="btn btn-primary btn-sm" id="nav-signup">Sign Up</a>
      </ng-container>

      <!-- Authenticated -->
      <ng-container *ngIf="auth.currentUser$ | async as user">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">Home</a>
        
        <!-- Patient Links -->
        <ng-container *ngIf="user.role === 'PATIENT'">
          <a routerLink="/patient/dashboard" routerLinkActive="active" class="nav-link">Dashboard</a>
          <a routerLink="/patient/questionnaire" routerLinkActive="active" class="nav-link">Find Doctor</a>
        </ng-container>

        <!-- Doctor Links -->
        <ng-container *ngIf="user.role === 'MEDECIN'">
          <a routerLink="/doctor/dashboard" routerLinkActive="active" class="nav-link">Medical Dashboard</a>
        </ng-container>

        <!-- Admin Links -->
        <ng-container *ngIf="user.role === 'ADMIN'">
          <a routerLink="/admin/dashboard" routerLinkActive="active" class="nav-link">Admin Dashboard</a>
        </ng-container>

        <div class="nav-profile">
          <div class="profile-avatar" id="user-avatar">
            {{ user.role.charAt(0) }}
          </div>
          <button class="btn btn-ghost btn-sm" (click)="auth.logout()" id="btn-logout">
            <i data-lucide="log-out" class="w-4 h-4 mr-2"></i>Logout
          </button>
        </div>
      </ng-container>
    </div>

    <!-- Mobile Toggle -->
    <button class="mobile-toggle" (click)="toggleMenu()" id="mobile-menu-toggle">
      <i data-lucide="menu" *ngIf="!mobileMenuOpen"></i>
      <i data-lucide="x" *ngIf="mobileMenuOpen"></i>
    </button>
  </div>
</nav>
